services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # Required: set POSTGRES_PASSWORD in .env (and use the same value in DATABASE_URL).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: discord_register
    ports:
      # Bind to localhost only. Docker-published ports bypass host firewalls such as ufw,
      # so "5432:5432" would expose the database to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
