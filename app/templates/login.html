{% extends "base.html" %}
{% block title %}Sign in · Discord Server Register{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Sign in</h1>
  <form id="login-form" class="stack">
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" minlength="8" required></label>
    <p class="form-error" hidden></p>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted small">Accounts are created by an administrator. Ask one for your email and password.</p>
</section>
{% endblock %}
{% block scripts %}<script src="{{ static_url('login.js') }}"></script>{% endblock %}
